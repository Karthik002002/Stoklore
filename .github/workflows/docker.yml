# Builds the Docker image only when asked - never on an ordinary commit:
#   - a version tag (`git tag v1.2.0 && git push origin v1.2.0`) builds and publishes
#     ghcr.io/karthik002002/stoklore :1.2.0, :1.2 and :latest
#   - Actions -> docker -> Run workflow builds it as a check; tick "publish" to also push
#     :sha-<commit>
# Publishing is always a deliberate step: this repo's main has been overwritten with malware before,
# and an image built from every push would have shipped it.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to ghcr.io (amd64 + arm64)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # arm64 is only built when publishing, and only it needs emulation (QEMU) on this amd64
      # runner. Emulated, it is many times slower, so a check builds amd64 alone.
      - if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Publishing also builds arm64, so the image runs natively on Apple Silicon and ARM servers.
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stoklore</title>
<!--
  Stoklore on the phone: the web app's public-data screens (no login, no Stoklore backend).
  lib.js = data + maths (checked by mobile/check.mjs), app.js = screens, routing, theme.
  Colours are CSS variables set from the chosen theme (Settings), so nothing below hard-codes one.
-->
<style>
  :root {
    --background: #0a0c0f; --card: #15181c; --panel-head: #101316; --muted: #1c1f24;
    --foreground: #d5d9de; --muted-foreground: #7d848d; --border: #23272c; --input: #30353b;
    --accent: #5b9cf5; --up: #2ebd85; --down: #ef5350; --warning: #e9b44c; --radius: 4px;
    --mono: ui-monospace, "Roboto Mono", "Droid Sans Mono", monospace;
    --tabbar: 58px;
    --font-body: var(--mono); --font-head: system-ui, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--background); color: var(--foreground); }
  body { font: 12px/1.35 var(--font-body); -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; overscroll-behavior-y: none; }
  button, select, input, textarea { font: inherit; color: inherit; }
  textarea { background: var(--background); }
  button { cursor: pointer; }
  .up { color: var(--up); } .down { color: var(--down); } .mute { color: var(--muted-foreground); } .acc { color: var(--accent); }
  .b { font-weight: 600; }

  /* ---- shell: top bar, the screen, bottom tabs ---- */
  #top { position: sticky; top: 0; z-index: 10; background: var(--panel-head); border-bottom: 1px solid var(--border); }
  .bar { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px; }
  .bar .logo { width: 24px; height: 24px; border-radius: 6px; padding: 3px; flex: none; }
  .bar h1 { flex: 1; min-width: 0; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar h1 small { display: block; font-size: 10px; letter-spacing: .04em; font-weight: 400; color: var(--muted-foreground); text-transform: none; }
  .back { width: 36px; height: 36px; margin-left: -6px; border: 0; background: transparent; display: grid; place-items: center; color: var(--foreground); }
  .back svg { width: 20px; height: 20px; }
  .sub { padding: 0 10px 8px; display: flex; gap: 6px; }
  #view { padding-bottom: calc(var(--tabbar) + 12px); min-height: 100vh; }
  #view.push { animation: push-in .22s cubic-bezier(.2,.8,.2,1); }
  #view.pop { animation: pop-in .2s ease-out; }
  #view.tab { animation: fade .15s ease-out; }
  @keyframes push-in { from { transform: translateX(28%); opacity: .3; } to { transform: none; opacity: 1; } }
  @keyframes pop-in { from { transform: translateX(-12%); opacity: .4; } to { transform: none; opacity: 1; } }
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; height: var(--tabbar); display: flex; background: var(--panel-head); border-top: 1px solid var(--border); }
  #tabs button { flex: 1; border: 0; background: transparent; color: var(--muted-foreground); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; letter-spacing: .04em; position: relative; }
  #tabs button svg { width: 20px; height: 20px; }
  #tabs button.on { color: var(--accent); }
  #tabs button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }

  /* ---- logo + opening animation ---- */
  .logo { background-image: linear-gradient(135deg, rgba(126,20,255,.4), rgba(134,59,255,.4), rgba(71,191,255,.4), rgba(126,20,255,.4)); background-size: 200% 200%; animation: gradient-move 4s ease-in-out infinite; }
  .logo img { display: block; width: 100%; height: 100%; }
  @keyframes gradient-move { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  #intro { position: fixed; inset: 0; z-index: 50; background: var(--background); display: grid; place-items: center; transition: opacity .45s ease, visibility .45s; }
  #intro .card { display: flex; flex-direction: column; align-items: center; transition: transform .45s cubic-bezier(.4,0,.2,1); }
  #intro .logo { width: 96px; height: 96px; border-radius: 26px; padding: 22px; animation: pop .7s cubic-bezier(.34,1.56,.64,1) both, gradient-move 2.4s ease-in-out infinite, glow 2.4s ease-in-out infinite; }
  #intro .word { margin-top: 18px; font: 600 26px/1 system-ui, sans-serif; letter-spacing: .02em; display: flex; }
  #intro .word span { display: inline-block; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  #intro .tag { margin-top: 8px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted-foreground); animation: fade .6s .75s both; }
  #intro .load { margin-top: 22px; width: 120px; height: 2px; border-radius: 1px; background: var(--muted); overflow: hidden; animation: fade .4s .9s both; }
  #intro .load i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #7e14ff, #47bfff); animation: slide 1s ease-in-out infinite; }
  #intro.done { opacity: 0; visibility: hidden; }
  #intro.done .card { transform: scale(1.12); }
  @keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 24px rgba(126,20,255,.25); } 50% { box-shadow: 0 0 44px rgba(71,191,255,.35); } }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #top, #view, #tabs { transition: opacity .4s ease .1s; }
  body.booting #top, body.booting #view, body.booting #tabs { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } }

  /* ---- controls ---- */
  .in { flex: 1; min-width: 0; height: 34px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--background); padding: 0 9px; outline: none; }
  .in:focus { border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--input); border-radius: var(--radius); overflow: hidden; flex: none; }
  .seg button { border: 0; background: transparent; padding: 0 10px; height: 32px; color: var(--muted-foreground); white-space: nowrap; }
  .seg button.on { background: var(--muted); color: var(--foreground); font-weight: 600; }
  .seg.full { display: flex; width: 100%; } .seg.full button { flex: 1; }
  .icon { width: 34px; height: 34px; flex: none; border: 1px solid var(--input); border-radius: var(--radius); background: transparent; display: grid; place-items: center; padding: 0; color: var(--foreground); }
  .icon svg { width: 15px; height: 15px; }
  .spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  select.sel { height: 28px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--background); color: var(--foreground); font-size: 11px; padding: 0 4px; max-width: 62%; }

  /* ---- shared blocks ---- */
  .sec { padding: 10px 10px 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); }
  .sec .act { letter-spacing: 0; text-transform: none; }
  .panel { margin: 0 10px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .state { padding: 32px 12px; text-align: center; color: var(--muted-foreground); }
  .err { margin: 8px 10px; padding: 8px 10px; border: 1px solid var(--down); border-radius: var(--radius); color: var(--down); font-size: 11px; }
  .li { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border); background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
  .li:last-child { border-bottom: 0; }
  .li .grow { flex: 1; min-width: 0; }
  .li .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .t2 { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .li .r { text-align: right; flex: none; }
  .li .r .t2 { text-align: right; }
  .li.busy { opacity: .55; }
  .chev { color: var(--muted-foreground); }
  .kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; }
  .kv div { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .kv div:nth-child(odd) { border-right: 1px solid var(--border); }
  .kv span { display: block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
  .chips { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; }
  .chips button { flex: none; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--input); background: transparent; color: var(--muted-foreground); }
  .chips button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* ---- markets ---- */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
  .icard { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px 6px; text-align: left; }
  .icard .n { font-size: 10px; letter-spacing: .08em; color: var(--muted-foreground); }
  .icard .p { font-size: 15px; font-weight: 600; margin-top: 3px; }
  .icard .c { font-size: 11px; margin-top: 1px; }
  .icard canvas { display: block; width: 100%; height: 30px; margin-top: 5px; }
  .breadthbar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--muted); margin-top: 6px; }
  .rank { width: 20px; flex: none; color: var(--muted-foreground); font-size: 11px; }
  .pill { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 10px; border: 1px solid var(--border); color: var(--muted-foreground); margin-left: 4px; }

  /* ---- chart ---- */
  .quote { padding: 12px 10px 4px; }
  .quote .p { font-size: 24px; font-weight: 600; }
  .quote .c { font-size: 13px; margin-top: 2px; }
  .quote .when { font-size: 10px; color: var(--muted-foreground); margin-top: 3px; }
  .chartbox { position: relative; margin: 0 10px; }
  .chartbox canvas { display: block; width: 100%; height: 260px; touch-action: pan-y; }
  .chartinfo { min-height: 16px; padding: 4px 10px 0; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctype { display: flex; justify-content: flex-end; padding: 0 10px; }
  .ctype .seg button { height: 26px; font-size: 11px; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 10px 10px; }
  .go { min-height: 46px; border-radius: var(--radius); border: 1px solid var(--input); background: var(--card); font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px; }
  .go span { font-size: 10px; font-weight: 400; color: var(--muted-foreground); }
  .go.primary { border-color: var(--accent); }
  .go:disabled { opacity: .5; }

  /* ---- sectors (the home panel) ---- */
  .summary { display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .summary .src { width: 100%; font-size: 11px; }
  .bar-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; color: var(--muted-foreground); }
  .tiles { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 8px 8px; }
  .tile { min-width: 4rem; overflow: hidden; border: 0; border-radius: 2px; padding: 4px 6px; text-align: left; }
  .tile.open { box-shadow: inset 0 0 0 1px var(--foreground); }
  .tile p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .tile p:first-child { font-weight: 600; }
  .tile p + p { opacity: .85; display: flex; justify-content: space-between; gap: 4px; }
  .map { border-bottom: 1px solid var(--border); }
  .row { border-bottom: 1px solid var(--border); padding: 9px 10px; scroll-margin-top: 100px; }
  .row.open { background: var(--muted); }
  .r1 { display: flex; align-items: baseline; gap: 6px; }
  .r1 .chev { width: 10px; display: inline-block; transition: transform .1s; }
  .row.open .r1 .chev { transform: rotate(90deg); }
  .r1 .nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .r1 .chg { font-weight: 600; font-size: 13px; }
  .r2 { display: flex; gap: 12px; margin: 3px 0 6px 16px; font-size: 11px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-left: 16px; align-items: center; }
  .changebar { position: relative; height: 8px; border-radius: 2px; background: var(--muted); }
  .changebar .mid { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--border); }
  .changebar .fill { position: absolute; top: 0; bottom: 0; }
  .breadth { display: flex; height: 10px; border-radius: 2px; overflow: hidden; background: var(--muted); }
  .strip { display: flex; height: 12px; border-radius: 2px; overflow: hidden; margin: 6px 0 0 16px; }
  .strip div { flex-basis: 0; min-width: 0; box-shadow: inset -1px 0 0 var(--background); }
  .bw { margin: 5px 0 0 16px; font-size: 11px; }
  .bw p { margin: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .members { margin-top: 8px; }
  .members .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; font-size: 11px; text-transform: uppercase; color: var(--muted-foreground); padding: 0 0 4px; }
  .members .tiles { padding: 0; }
  .members .tile { min-width: 4.5rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 10px 8px; font-size: 10px; color: var(--muted-foreground); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 4px; vertical-align: -1px; }

  /* ---- bottom card (a sector member) ---- */
  #sheet { position: fixed; left: 8px; right: 8px; bottom: calc(var(--tabbar) + 8px); z-index: 20; background: var(--panel-head); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.45); display: none; }
  #sheet.on { display: block; animation: rise .18s ease-out; }
  #sheet h3 { margin: 0 0 2px; font-size: 14px; }
  #sheet .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin-top: 8px; }
  #sheet .kv2 span:nth-child(odd) { color: var(--muted-foreground); }
  #sheet .links { padding: 12px 0 0; }

  /* ---- settings ---- */
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 10px 10px; }
  .theme { border: 1px solid var(--border); border-radius: 6px; padding: 0; overflow: hidden; text-align: left; background: transparent; }
  .theme.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .theme .pv { height: 54px; padding: 7px; display: flex; flex-direction: column; gap: 4px; }
  .theme .pv i { display: block; height: 6px; border-radius: 2px; }
  .theme .pv .sw { display: flex; gap: 3px; margin-top: auto; }
  .theme .pv .sw i { width: 18px; height: 10px; }
  .theme .nm { padding: 6px 7px; font-size: 11px; font-weight: 600; border-top: 1px solid var(--border); background: var(--card); }
  .tok { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .tok:last-child { border-bottom: 0; }
  .tok .lbl { flex: 1; }
  .tok .cur { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--input); padding: 0; }
  .tok input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--input); border-radius: 6px; background: transparent; }
  .tok input.hex { width: 84px; flex: none; height: 30px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; }
  .swatches button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--input); padding: 0; }
  .tok.on { background: var(--muted); }
  .btnrow { display: flex; gap: 8px; padding: 0 10px 10px; }
  .btn { flex: 1; height: 38px; border-radius: var(--radius); border: 1px solid var(--input); background: var(--card); font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--background); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 16px); transform: translateX(-50%); z-index: 30; max-width: 86%; background: var(--foreground); color: var(--background); padding: 8px 12px; border-radius: 6px; font-size: 11px; animation: fade .18s ease-out; }
  /* ---- feed: one card per screen, snap scrolling ---- */
  body.feed-on { overflow: hidden; }
  body.feed-on #view { padding-bottom: 0; min-height: 0; }
  #feed { height: calc(100vh - 49px - var(--tabbar)); overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; }
  .fcard { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 8px 10px; }
  .fin { height: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; animation: fade .2s ease-out; }
  .fk { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fname { font: 600 19px/1.2 system-ui, sans-serif; }
  .fbig { font-size: 24px; font-weight: 600; }
  .fstory { font-size: 13px; line-height: 1.4; }
  .ffacts { font-size: 11px; color: var(--muted-foreground); min-height: 15px; }
  .fchart { flex: 1; min-height: 110px; position: relative; }
  .fchart canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fkv { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .fkv div:nth-last-child(-n+2) { border-bottom: 0; }
  .fl { padding: 0; }
  .ftiles { padding: 0; flex: 1; min-height: 0; overflow: hidden; align-content: flex-start; }
  .ftiles .tile { min-width: 3.6rem; }
  .flist { margin: 0; }
  .flist .li { padding: 7px 8px; }
  #sheet.big { max-height: calc(100vh - var(--tabbar) - 70px); overflow-y: auto; }
  .fxh { margin-top: 10px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 2px; }
  .fchips button { height: 30px; padding: 0 11px; border-radius: 15px; border: 1px solid var(--input); background: transparent; color: var(--muted-foreground); }
  .fchips button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--muted); }
  .fxbtns { position: sticky; bottom: -12px; padding: 8px 0; margin: 0 -2px -4px; background: var(--panel-head); }
  .icon.on { border-color: var(--accent); color: var(--accent); }
  /* top-bar refresh: ⟳ now | auto-refresh beat */
  .rgroup { display: flex; flex: none; border: 1px solid var(--input); border-radius: var(--radius); overflow: hidden; }
  .rgroup .icon { border: 0; border-radius: 0; }
  .rbeat { border: 0; border-left: 1px solid var(--input); background: transparent; color: var(--accent); font-size: 10px; font-weight: 600; min-width: 34px; padding: 0 7px; height: 32px; }
  .rbeat.off, .rbeat.paused { color: var(--muted-foreground); }
  .rbeat.paused { text-decoration: line-through; }
  .fimg { flex: 1; min-height: 0; max-height: 46%; border-radius: 6px; overflow: hidden; background: var(--muted); }
  .fimg img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .fsizes { display: flex; flex-direction: column; gap: 14px; flex: 1; justify-content: center; }
  .fsz { display: grid; gap: 5px; }
  .note { padding: 0 10px 12px; font-size: 11px; color: var(--muted-foreground); line-height: 1.5; }
  /* ---- a sector full screen (zoomable heatmap) ---- */
  #zoom { position: fixed; inset: 0; z-index: 18; background: var(--background); display: none; flex-direction: column; }
  #zoom.on { display: flex; animation: fade .15s ease-out; }
  .zbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--panel-head); border-bottom: 1px solid var(--border); }
  .zbar .grow { flex: 1; min-width: 0; }
  .zbar .t1 { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zbar .t2 { font-size: 10.5px; color: var(--muted-foreground); }
  .zbar .icon svg { width: 17px; height: 17px; }
  .zview { flex: 1; overflow: auto; position: relative; touch-action: pan-x pan-y; background: var(--background); }
  .zmap { position: relative; transform-origin: 0 0; }
  .zfoot { padding: 2px 10px 12px; border-top: 1px solid var(--border); }
  .zfoot .legend { padding: 8px 0 4px; }
  /* ---- sector charts ---- */
  .tvmap { position: relative; margin: 4px 8px 6px; border-radius: 6px; overflow: hidden; background: var(--background); }
  .tvsec { position: absolute; overflow: hidden; box-shadow: inset 0 0 0 1px var(--background); }
  .tvsec.open { box-shadow: inset 0 0 0 2px var(--foreground); z-index: 1; }
  .tvhead { position: absolute; left: 0; top: 0; right: 0; height: 15px; border: 0; background: var(--panel-head); color: var(--foreground); font-size: 9px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; text-align: left; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tvhead span { font-weight: 400; opacity: .75; }
  .tvcell { position: absolute; border: 0; padding: 1px 2px; border-radius: 0; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; line-height: 1.1; font-weight: 600; text-align: center; }
  .tvcell span { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .schips { padding: 8px 10px 2px; }
